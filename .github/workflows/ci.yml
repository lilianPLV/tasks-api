name:  CI
on:  push
jobs:
    test:
        runs-on:  ubuntu-latest
        steps:
            - uses:  actions/checkout@v6
            - uses:  actions/setup-python@v7
              with:
                python-version: "3.12"
            - run: pip install -r requirements-dev.txt
            - run: pytest --cov=app --cov-fail-under=80
    lint: 
        runs-on: ubuntu-latest
        steps:
            - uses:  actions/checkout@v6
            - uses:  actions/setup-python@v7
              with:
                python-version: "3.12"
            - run:  pip install -r requirements-dev.txt
            - run:  flake8 .
            - run:  black --check .