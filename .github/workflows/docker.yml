name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Calculer le nom de l'image et la version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image du commit
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api:sha-${GITHUB_SHA::7}"
          echo "Image : $IMAGE"
          docker run -d --name api -p 8000:8000 "$IMAGE"

      - name: Test de fumée
        run: |
          for path in /health /version; do
            ok=false
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:8000${path}"; then
                ok=true
                echo
                break
              fi
              echo "Essai $i : ${path} pas encore prêt"
              sleep 2
            done
            if [ "$ok" != "true" ]; then
              echo "Échec sur ${path}"
              docker logs api
              exit 1
            fi
          done

      - name: Arrêt
        if: always()
        run: docker rm -f api

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image de la release
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api:${GITHUB_REF_NAME#v}"
          echo "Image : $IMAGE"
          docker run -d --name api -p 8000:8000 "$IMAGE"

      - name: Test de fumée
        run: |
          for path in /health /version; do
            ok=false
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:8000${path}"; then
                ok=true
                echo
                break
              fi
              echo "Essai $i : ${path} pas encore prêt"
              sleep 2
            done
            if [ "$ok" != "true" ]; then
              echo "Échec sur ${path}"
              docker logs api
              exit 1
            fi
          done

      - name: Arrêt
        if: always()
        run: docker rm -f api

  update-config:
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v6

      - name: Récupérer le dépôt de configuration
        uses: actions/checkout@v6
        with:
          repository: lilianplv/tasks-api
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Vérifier les droits du token
        env:
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/lilianplv/tasks-api \
            | grep -A6 '"permissions"'

      - name: Mettre à jour la version de l'image
        run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - name: Commiter et pousser dans tasks-api
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push